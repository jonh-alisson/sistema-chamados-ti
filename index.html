
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados de TI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Sistema de Chamados de TI</h1>

    <p>Bem-vindo ao nosso sistema de suporte técnico!</p>

    <div id="tela-inicial" class="tela-inicial">
    <h2>O que deseja fazer?</h2>

    <button type="button" id="btnAbrirChamado">
        Abrir um novo chamado
    </button>

    <button type="button" id="btnConsultarChamados">
        Consultar meus chamados
    </button>
</div>

    <form id="ticket-form" hidden>

        <label for="nome">Nome do solicitante:</label>
        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            required
        >

        <label for="email">E-mail:</label>
        <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            required
        >

        <label for="categoria">Categoria do problema:</label>
        <select id="categoria" required>
            <option value="">Selecione uma categoria</option>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Rede">Rede e Internet</option>
            <option value="Acesso">Acesso ao sistema</option>
            <option value="Outros">Outros</option>
        </select>

        <label for="prioridade">Prioridade:</label>
        <select id="prioridade" required>
            <option value="">Selecione a prioridade</option>
            <option value="Baixa">Baixa</option>
            <option value="Média">Média</option>
            <option value="Alta">Alta</option>
            <option value="Crítica">Crítica</option>
        </select>

        <label for="descricao">Descrição do problema:</label>
        <textarea
            id="descricao"
            placeholder="Descreva detalhadamente o problema"
            required
        ></textarea>

        <button type="submit">Abrir chamado</button>

    </form>
    <form id="consulta-form" hidden>

    <h2>Consultar meus chamados</h2>

    <label for="consulta-email">Digite seu e-mail:</label>

    <input
        type="email"
        id="consulta-email"
        placeholder="Digite o e-mail utilizado na abertura"
        required
    >

    <button type="submit">Consultar chamados</button>

    <div id="resultado-consulta"></div>
    <button type="button" id="btnVoltarInicio">
    Voltar à tela inicial
</button>
</form>
    <script src="app.js"></script>

</body>
</html>
