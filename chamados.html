
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Chamados - Sistema de TI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema de Chamados de TI</h1>
        <p>Consulta de solicitações de suporte técnico</p>
    </header>

    <main>
        <h2>Chamados registrados</h2>
<div class="painel-indicadores">

    <div class="indicador">
        <h3>Total de chamados</h3>
        <p id="totalChamados">0</p>
    </div>

    <div class="indicador">
        <h3>Em andamento</h3>
        <p id="chamadosAndamento">0</p>
    </div>

    <div class="indicador">
        <h3>Abertos</h3>
        <p id="chamadosAbertos">0</p>
    </div>

    <div class="indicador">
    <h3>Concluídos</h3>
    <p id="chamadosConcluidos">0</p>
</div>

</div>
        <a href="index.html" class="botao-voltar">
            Voltar ao início
        </a>
        <button id="gerarPDF" class="botao-voltar" type="button">
    Gerar relatório em PDF
</button>
<button id="exportarExcel" class="botao-voltar" type="button">
    Exportar para Excel
</button>
        <div class="filtros">

    <input
        type="text"
        id="pesquisaProtocolo"
        placeholder="Pesquisar por protocolo..."
    >

    <select id="filtroStatus">
        <option value="">Todos os status</option>
        <option value="Aberto">Aberto</option>
        <option value="Em andamento">Em andamento</option>
        <option value="Concluído">Concluído</option>
    </select>

    <select id="filtroPrioridade">
        <option value="">Todas as prioridades</option>
        <option value="Baixa">Baixa</option>
        <option value="Média">Média</option>
        <option value="Alta">Alta</option>
        <option value="Crítica">Crítica</option>
    </select>

</div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Protocolo</th>
                        <th>Solicitante</th>
                        <th>Categoria</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaChamados">
                </tbody>
            </table>
        </div>

        <p id="mensagem"></p>
    </main>

    <script>
        const chamados = JSON.parse(
            localStorage.getItem("chamadosTI") || "[]"
        );
        chamados.forEach(chamado => {
    if (!chamado.status) {
        chamado.status = "Aberto";
    }
});
       function atualizarIndicadores() {
    document.getElementById("totalChamados").textContent = chamados.length;

    document.getElementById("chamadosAndamento").textContent =
        chamados.filter(chamado => chamado.status === "Em andamento").length;

    document.getElementById("chamadosAbertos").textContent =
        chamados.filter(chamado => chamado.status === "Aberto").length;
    document.getElementById("chamadosConcluidos").textContent =
    chamados.filter(chamado => chamado.status === "Concluído").length;
           
}

atualizarIndicadores(); 

        const lista = document.getElementById("listaChamados");
        const mensagem = document.getElementById("mensagem");

        if (chamados.length === 0) {

            mensagem.textContent = "Nenhum chamado registrado.";

        } else {

            chamados.forEach(chamado => {

                const linha = document.createElement("tr");



const valores = [
    chamado.protocolo,
    chamado.nome,
    chamado.categoria,
    chamado.prioridade,
    chamado.status,
    chamado.data,
    chamado.descricao
];

valores.forEach((valor, indice) => {

    const coluna = document.createElement("td");

    if (indice === 4) {

        const seletor = document.createElement("select");

        const status = ["Aberto", "Em andamento", "Concluído"];

        status.forEach(item => {
            const opcao = document.createElement("option");
            opcao.value = item;
            opcao.textContent = item;
            seletor.appendChild(opcao);
        });

        seletor.value = chamado.status || "Aberto";

        seletor.addEventListener("change", function() {
            chamado.status = seletor.value;

            localStorage.setItem(
                "chamadosTI",
                JSON.stringify(chamados)
            );
atualizarIndicadores();
            
        });

        coluna.appendChild(seletor);

    } else {

        coluna.textContent = valor || "-";

    }

    linha.appendChild(coluna);

});


                
const botaoExcluir = document.createElement("button");
botaoExcluir.textContent = "Excluir";

botaoExcluir.addEventListener("click", function() {
    if (confirm("Tem certeza que deseja excluir este chamado?")) {
        const indice = chamados.indexOf(chamado);
        chamados.splice(indice, 1);

        localStorage.setItem(
            "chamadosTI",
            JSON.stringify(chamados)
        );

        location.reload();
    }
});

const colunaExcluir = document.createElement("td");
colunaExcluir.appendChild(botaoExcluir);
linha.appendChild(colunaExcluir);
lista.appendChild(linha);

            });

        }
        const pesquisaProtocolo = document.getElementById("pesquisaProtocolo");
const filtroStatus = document.getElementById("filtroStatus");
const filtroPrioridade = document.getElementById("filtroPrioridade");

function aplicarFiltros() {
    const termo = pesquisaProtocolo.value.toLowerCase().trim();
    const statusSelecionado = filtroStatus.value;
    const prioridadeSelecionada = filtroPrioridade.value;

    const linhas = lista.querySelectorAll("tr");

    linhas.forEach(linha => {
        const protocolo = linha.cells[0].textContent.toLowerCase();
        const prioridade = linha.cells[3].textContent.trim();

        const seletorStatus = linha.cells[4].querySelector("select");
        const statusAtual = seletorStatus
            ? seletorStatus.value
            : linha.cells[4].textContent.trim();

        const correspondeProtocolo = protocolo.includes(termo);
        const correspondeStatus =
            !statusSelecionado || statusAtual === statusSelecionado;
        const correspondePrioridade =
            !prioridadeSelecionada || prioridade === prioridadeSelecionada;

        linha.style.display =
            correspondeProtocolo &&
            correspondeStatus &&
            correspondePrioridade
                ? ""
                : "none";
    });
        const chamadosVisiveis = [...linhas].filter(
        linha => linha.style.display !== "none"
    ).length;

    mensagem.textContent = chamadosVisiveis === 0
        ? "Nenhum chamado encontrado com os filtros selecionados."
        : "";
}

pesquisaProtocolo.addEventListener("input", aplicarFiltros);
filtroStatus.addEventListener("change", aplicarFiltros);
filtroPrioridade.addEventListener("change", aplicarFiltros);
document.getElementById("gerarPDF").addEventListener("click", function() {

    const escapar = texto => String(texto ?? "").replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[caractere]));

    const relatorio = window.open("", "_blank");

    if (!relatorio) {
        alert("Permita a abertura de janelas pop-up para gerar o relatório.");
        return;
    }
const termo = document.getElementById("pesquisaProtocolo").value.toLowerCase().trim();

const statusSelecionado = document.getElementById("filtroStatus").value;

const prioridadeSelecionada = document.getElementById("filtroPrioridade").value;

const chamadosFiltrados = chamados.filter(chamado =>
    chamado.protocolo.toLowerCase().includes(termo) &&
    (!statusSelecionado || chamado.status === statusSelecionado) &&
    (!prioridadeSelecionada || chamado.prioridade === prioridadeSelecionada)
);
    const linhas = chamadosFiltrados.map(chamado => `
        <tr>
            <td>${escapar(chamado.protocolo)}</td>
            <td>${escapar(chamado.nome)}</td>
            <td>${escapar(chamado.categoria)}</td>
            <td>${escapar(chamado.prioridade)}</td>
            <td>${escapar(chamado.status)}</td>
            <td>${escapar(chamado.data)}</td>
            <td>${escapar(chamado.descricao)}</td>
        </tr>
    `).join("");

    const conteudo = `
        <html>
        <head>
            <meta charset="UTF-8">
            <title>Relatório de Chamados de TI</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    padding: 25px;
                    color: #333;
                }
                h1 {
                    color: #2563eb;
                    text-align: center;
                }
                .data {
                    text-align: right;
                    margin-bottom: 25px;
                }
               .resumo {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 20px 0;
}

.resumo h3 {
    grid-column: 1 / -1;
    margin-bottom: 5px;
}

.resumo p {
    background-color: #f1f5f9;
    padding: 15px;
    border-radius: 8px;
    margin: 0;
    border-left: 5px solid #2563eb;
}

.resumo p:nth-of-type(1) {
    border-left-color: #dc2626;
}

.resumo p:nth-of-type(2) {
    border-left-color: #f59e0b;
}

.resumo p:nth-of-type(3) {
    border-left-color: #16a34a;
} table {
                    width: 100%;
                    border-collapse: collapse;
                    font-size: 11px;
                }
                th, td {
                    border: 1px solid #ddd;
                    padding: 8px;
                    text-align: left;
                }
                th {
                    background: #2563eb;
                    color: white;
                }
                @media print {
                    body { padding: 0; }
                }
            </style>
        </head>
        <body>
            <h1>Relatório de Chamados de TI</h1>
            <p class="data">Emitido em: ${new Date().toLocaleString("pt-BR")}</p>

            <h3>Total de chamados: ${chamadosFiltrados.length}</h3>
        <div class="resumo">
            <h3>Resumo por situação</h3>
            <p>Chamados abertos: ${chamadosFiltrados.filter(chamado => chamado.status === "Aberto").length}</p>
            <p>Chamados em andamento: ${chamadosFiltrados.filter(chamado => chamado.status === "Em andamento").length}</p>
            <p>Chamados concluídos: ${chamadosFiltrados.filter(chamado => chamado.status === "Concluído").length}</p>
        </div>

            <table>
                <thead>
                    <tr>
                        <th>Protocolo</th>
                        <th>Solicitante</th>
                        <th>Categoria</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Descrição</th>
                    </tr>
                </thead>
                <tbody>
                    ${linhas}
                </tbody>
            </table>
        </body>
        </html>
    `;

    relatorio.onload = function() {
        relatorio.focus();
        relatorio.print();
    };

    relatorio.document.write(conteudo);
    relatorio.document.close();
}); 
   document.getElementById("exportarExcel").addEventListener("click", function() {

    const chamadosExportacao = JSON.parse(localStorage.getItem("chamadosTI")) || [];

    if (chamadosExportacao.length === 0) {
        alert("Não existem chamados para exportar.");
        return;
    }

    const cabecalho = [
        "Protocolo",
        "Solicitante",
        "Categoria",
        "Prioridade",
        "Status",
        "Data",
        "Descrição"
    ];

    const linhas = chamadosExportacao.map(chamado =>
        [
            chamado.protocolo,
            chamado.nome,
            chamado.categoria,
            chamado.prioridade,
            chamado.status,
            chamado.data,
            chamado.descricao
        ].map(valor => `"${String(valor ?? "").replace(/"/g, '""')}"`).join(";")
    );

    const csv = "\uFEFF" + [cabecalho.join(";"), ...linhas].join("\r\n");

    const arquivo = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const link = document.createElement("a");
    const url = URL.createObjectURL(arquivo);

    link.href = url;
    link.download = "chamados-ti.csv";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);

});
    </script>

</body>
</html>
