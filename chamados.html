
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Chamados - Sistema de TI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema de Chamados de TI</h1>
        <p>Consulta de solicitações de suporte técnico</p>
    </header>

    <main>
        <h2>Chamados registrados</h2>

        <a href="index.html" class="botao-voltar">
            Voltar ao início
        </a>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Protocolo</th>
                        <th>Solicitante</th>
                        <th>Categoria</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Descrição</th>
                    </tr>
                </thead>

                <tbody id="listaChamados">
                </tbody>
            </table>
        </div>

        <p id="mensagem"></p>
    </main>

    <script>
        const chamados = JSON.parse(
            localStorage.getItem("chamadosTI") || "[]"
        );
        chamados.forEach(chamado => {
    if (!chamado.status) {
        chamado.status = "Aberto";
    }
});

        const lista = document.getElementById("listaChamados");
        const mensagem = document.getElementById("mensagem");

        if (chamados.length === 0) {

            mensagem.textContent = "Nenhum chamado registrado.";

        } else {

            chamados.forEach(chamado => {

                const linha = document.createElement("tr");



const valores = [
    chamado.protocolo,
    chamado.nome,
    chamado.categoria,
    chamado.prioridade,
    chamado.status,
    chamado.data,
    chamado.descricao
];

valores.forEach((valor, indice) => {

    const coluna = document.createElement("td");

    if (indice === 4) {

        const seletor = document.createElement("select");

        const status = ["Aberto", "Em andamento", "Concluído"];

        status.forEach(item => {
            const opcao = document.createElement("option");
            opcao.value = item;
            opcao.textContent = item;
            seletor.appendChild(opcao);
        });

        seletor.value = chamado.status || "Aberto";

        seletor.addEventListener("change", function() {
            chamado.status = seletor.value;

            localStorage.setItem(
                "chamadosTI",
                JSON.stringify(chamados)
            );
        });

        coluna.appendChild(seletor);

    } else {

        coluna.textContent = valor || "-";

    }

    linha.appendChild(coluna);

});


                
const botaoExcluir = document.createElement("button");
botaoExcluir.textContent = "Excluir";

botaoExcluir.addEventListener("click", function() {
    if (confirm("Tem certeza que deseja excluir este chamado?")) {
        const indice = chamados.indexOf(chamado);
        chamados.splice(indice, 1);

        localStorage.setItem(
            "chamadosTI",
            JSON.stringify(chamados)
        );

        location.reload();
    }
});

const colunaExcluir = document.createElement("td");
colunaExcluir.appendChild(botaoExcluir);
linha.appendChild(colunaExcluir);
lista.appendChild(linha);

            });

        }
    </script>

</body>
</html>
